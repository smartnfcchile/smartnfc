name: Campaign Stage 1 Linux build review
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/campaign-stage1-build-review.yml']

permissions:
  contents: read

jobs:
  build:
    if: github.event.pull_request.head.ref == 'feature/campaign-landing-stage-1'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        checkout: [baseline, review]
    env:
      DATABASE_URL: postgresql://blocked@127.0.0.1:1/blocked
      DIRECT_URL: postgresql://blocked@127.0.0.1:1/blocked
      NEXTAUTH_SECRET: isolated-build-placeholder
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ matrix.checkout == 'baseline' && 'a27a9e5adb05883ebfb7e8ea40e60234b81c156d' || github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
