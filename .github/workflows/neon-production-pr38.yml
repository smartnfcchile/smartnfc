name: Neon Production PR 38
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Operation for PR 38
        required: true
        type: choice
        options: [diagnose, migrate]
      recovery_branch_id:
        description: Verified Neon recovery branch ID (required for migration)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: neon-production-pr38
  cancel-in-progress: false

jobs:
  production:
    if: github.ref == 'refs/heads/main' && github.repository == 'smartnfcchile/smartnfc'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: neon-production-pr38
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 25fe3836aedc275ddb85efe9b82c6a74f0725eec
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify source and prepare Prisma without production credentials
        run: |
          test "$(git rev-parse HEAD)" = 25fe3836aedc275ddb85efe9b82c6a74f0725eec
          npm ci --no-audit --no-fund
          ./node_modules/.bin/prisma generate
      - name: Authenticate and verify the pending migration, read only
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          node <<'NODE'
          const net = require('node:net');
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const { PrismaClient } = require('@prisma/client');
          const expected = '20261124190000_campaign_landing';
          const host = 'ep-long-cloud-aqt2my7m.c-8.us-east-1.aws.neon.tech';
          const hash = content => crypto.createHash('sha256').update(content).digest('hex');

          async function main() {
            const url = new URL(process.env.DIRECT_URL ?? '');
            if (url.protocol !== 'postgresql:' || url.hostname !== host ||
                url.pathname !== '/neondb' || (url.port && url.port !== '5432') ||
                !url.username || !url.password || url.hash ||
                url.searchParams.getAll('sslmode').length !== 1 ||
                url.searchParams.get('sslmode') !== 'require' ||
                [...url.searchParams.keys()].some(key => !['sslmode', 'channel_binding'].includes(key))) {
              throw new Error('Unexpected destination');
            }
            await new Promise((resolve, reject) => {
              const socket = net.connect(5432, host);
              socket.setTimeout(8000);
              socket.once('connect', () => { socket.destroy(); resolve(); });
              socket.once('timeout', () => { socket.destroy(); reject(); });
              socket.once('error', reject);
            });
            console.log('Direct TCP connection confirmed');
            url.searchParams.set('connect_timeout', '8');
            const client = new PrismaClient({ datasourceUrl: url.href, log: [] });
            try {
              await client.$transaction(async tx => {
                await tx.$executeRaw`SET TRANSACTION READ ONLY`;
                const [identity] = await tx.$queryRaw`
                  SELECT current_database() = 'neondb'
                    AND current_setting('transaction_read_only') = 'on'
                    AND to_regclass('public."CampaignLanding"') IS NULL
                    AND to_regclass('public."CampaignLandingVersion"') IS NULL
                    AND to_regclass('public."CampaignLandingSite"') IS NULL
                    AND to_regprocedure('public.campaign_landing_version_immutable()') IS NULL
                    AND NOT EXISTS (
                      SELECT 1 FROM information_schema.columns
                      WHERE table_schema = 'public' AND table_name = 'SolutionTag' AND column_name = 'campaignSiteId'
                    ) AS verified
                `;
                if (!identity?.verified) throw new Error('Identity or schema discrepancy');
                const rows = await tx.$queryRaw`
                  SELECT migration_name, checksum, finished_at IS NOT NULL AS finished,
                    rolled_back_at IS NOT NULL AS rolled_back
                  FROM "_prisma_migrations"
                `;
                const dirs = fs.readdirSync('prisma/migrations', { withFileTypes: true })
                  .filter(entry => entry.isDirectory()).map(entry => entry.name);
                const applied = new Set();
                for (const row of rows) {
                  if (!dirs.includes(row.migration_name) || !row.finished || row.rolled_back ||
                      applied.has(row.migration_name)) throw new Error('Unexpected migration history');
                  const sql = fs.readFileSync('prisma/migrations/' + row.migration_name + '/migration.sql', 'utf8');
                  const lf = sql.replace(/\r\n/g, '\n');
                  if (![hash(lf), hash(lf.replace(/\n/g, '\r\n'))].includes(row.checksum)) {
                    throw new Error('Checksum mismatch');
                  }
                  applied.add(row.migration_name);
                }
                const pending = dirs.filter(dir => !applied.has(dir));
                if (pending.length !== 1 || pending[0] !== expected) throw new Error('Unexpected pending migration');
              }, { maxWait: 10000, timeout: 12000 });
              console.log('Authenticated read-only in neondb; exactly the PR 38 migration is pending');
            } finally {
              await client.$disconnect();
            }
          }
          main().catch(() => { console.error('PR 38 preflight failed'); process.exitCode = 1; });
          NODE
      - name: Apply and verify the authorized migration
        if: inputs.operation == 'migrate'
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          RECOVERY_BRANCH_ID: ${{ inputs.recovery_branch_id }}
        run: |
          test "$(git rev-parse HEAD)" = 25fe3836aedc275ddb85efe9b82c6a74f0725eec
          node <<'NODE'
          const { spawnSync } = require('node:child_process');
          const { createHash } = require('node:crypto');
          const { readFileSync } = require('node:fs');
          const { PrismaClient } = require('@prisma/client');
          const migration = '20261124190000_campaign_landing';

          function deploy(requireNoPending) {
            // This pinned Prisma schema reads DATABASE_URL. Pass the validated direct URL only to this child.
            const result = spawnSync('./node_modules/.bin/prisma', ['migrate', 'deploy'], {
              env: { ...process.env, DATABASE_URL: process.env.DIRECT_URL },
              encoding: 'utf8',
              timeout: 180000,
            });
            if (result.status !== 0 || (requireNoPending && !/No pending migrations to apply/i.test(result.stdout ?? ''))) {
              throw new Error('Prisma deploy did not pass');
            }
          }

          async function main() {
            const recovery = process.env.RECOVERY_BRANCH_ID ?? '';
            if (!/^br-[a-z0-9-]{8,100}$/.test(recovery) ||
                recovery === 'br-divine-bonus-aqtmhjaw' ||
                recovery === 'br-flat-cherry-aq38xwvo') throw new Error('Verified recovery branch required');
            console.log('Recovery branch declared by the operator; reviewer must verify its origin and readiness in Neon');
            deploy(false);
            const url = new URL(process.env.DIRECT_URL);
            url.searchParams.set('connect_timeout', '8');
            const client = new PrismaClient({ datasourceUrl: url.href, log: [] });
            try {
              await client.$transaction(async tx => {
                await tx.$executeRaw`SET TRANSACTION READ ONLY`;
                const checksum = createHash('sha256')
                  .update(readFileSync('prisma/migrations/' + migration + '/migration.sql')).digest('hex');
                const [row] = await tx.$queryRaw`
                  SELECT current_database() = 'neondb'
                    AND EXISTS (SELECT 1 FROM "_prisma_migrations" WHERE migration_name = ${migration}
                      AND checksum = ${checksum} AND finished_at IS NOT NULL AND rolled_back_at IS NULL)
                    AND EXISTS (SELECT 1 FROM information_schema.columns WHERE table_schema = 'public'
                      AND table_name = 'SolutionTag' AND column_name = 'campaignSiteId' AND is_nullable = 'YES')
                    AND (SELECT count(*) FROM pg_constraint WHERE contype = 'f' AND convalidated AND conname IN (
                      'SolutionTag_campaignSiteId_projectId_companyId_fkey',
                      'CampaignLanding_projectId_companyId_fkey',
                      'CampaignLanding_publishedVersionId_projectId_companyId_fkey',
                      'CampaignLandingVersion_projectId_companyId_fkey',
                      'CampaignLandingSite_projectId_companyId_fkey'
                    )) = 5
                    AND EXISTS (SELECT 1 FROM pg_trigger WHERE tgrelid = 'public."CampaignLandingVersion"'::regclass
                      AND tgname = 'campaign_landing_version_immutable' AND tgenabled = 'O')
                    AND to_regclass('public."CampaignLanding"') IS NOT NULL
                    AND to_regclass('public."CampaignLandingSite"') IS NOT NULL AS verified
                `;
                if (!row?.verified) throw new Error('Post-migration checks failed');
              }, { maxWait: 10000, timeout: 12000 });
            } finally {
              await client.$disconnect();
            }
            deploy(true);
            console.log('Authorized migration recorded; schema verified; zero pending migrations');
          }
          main().catch(() => { console.error('PR 38 migration stopped; inspect schema and migration history before retrying'); process.exitCode = 1; });
          NODE
