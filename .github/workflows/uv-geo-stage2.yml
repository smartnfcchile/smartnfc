name: SmartNFC Geo Stage 2
on:
  push:
    branches: [feature/uv-2-2-smartnfc-geo]
    paths: ['.github/workflows/uv-geo-stage2.yml', 'app/**', 'components/**', 'lib/**', 'next.config.ts', 'scripts/tests/**']
permissions:
  contents: read
jobs:
  isolated:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: uv_geo
          POSTGRES_PASSWORD: ci-loopback-only
          POSTGRES_DB: uv_geo_disposable
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U uv_geo -d uv_geo_disposable"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://uv_geo:ci-loopback-only@127.0.0.1:5432/uv_geo_disposable
      DIRECT_URL: postgresql://uv_geo:ci-loopback-only@127.0.0.1:5432/uv_geo_disposable
      SMARTNFC_MET_UV_ENABLED: '0'
      NEXT_TELEMETRY_DISABLED: '1'
      LOCAL_REPORT_EMAIL_MODE: disabled
      RESEND_API_KEY: ''
      BLOB_READ_WRITE_TOKEN: ''
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Prepare schema on disposable loopback PostgreSQL
        run: |
          expected='postgresql://uv_geo:ci-loopback-only@127.0.0.1:5432/uv_geo_disposable'
          test "$DATABASE_URL" = "$expected"
          test "$DIRECT_URL" = "$expected"
          npm run db:migrate
      - name: Generate temporary authentication secret
        run: |
          secret="$(openssl rand -hex 32)"
          printf '::add-mask::%s\n' "$secret"
          printf 'NEXTAUTH_SECRET=%s\n' "$secret" >> "$GITHUB_ENV"
      - run: |
          mkdir -p app/s/geo-fixture
          cp scripts/tests/e2e/uv-geo-fixture.tsx.txt app/s/geo-fixture/page.tsx
          mkdir -p public/uv-stage1
          cp -R demos/uv22/. public/uv-stage1/
          npm run build
      - run: npm run typecheck
      - run: npx --no-install eslint components/soluciones/CampaignUv*.tsx lib/soluciones/smartnfc-geo.ts scripts/tests/e2e/uv-geo*.ts scripts/tests/soluciones-uv-geo.test.ts
      - name: Run unit and PostgreSQL integration tests
        env:
          CAMPAIGN_TEST_DATABASE_URL: postgresql://uv_geo:ci-loopback-only@127.0.0.1:5432/uv_geo_disposable
        run: node --import tsx --test scripts/tests/soluciones-uv-geo.test.ts scripts/tests/soluciones-uv21.test.ts scripts/tests/soluciones-campaign-editor.test.ts scripts/tests/soluciones-campaign-landing.test.ts
      - run: npx --no-install playwright install --with-deps chromium webkit
      - run: npx --no-install playwright test --config scripts/tests/e2e/uv-geo.config.ts --workers=1 --trace=retain-on-failure
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: uv-geo-screenshots
          path: playwright-evidence
          retention-days: 7
