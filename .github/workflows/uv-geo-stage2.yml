name: SmartNFC Geo Stage 2
on:
  push:
    branches: [feature/uv-2-2-smartnfc-geo]
    paths: ['.github/workflows/uv-geo-stage2.yml', 'app/**', 'components/**', 'lib/**', 'next.config.ts', 'scripts/tests/**']
permissions:
  contents: read
jobs:
  isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://fixture@127.0.0.1:1/disposable
      DIRECT_URL: postgresql://fixture@127.0.0.1:1/disposable
      SMARTNFC_MET_UV_ENABLED: '0'
      NEXT_TELEMETRY_DISABLED: '1'
      LOCAL_REPORT_EMAIL_MODE: disabled
      RESEND_API_KEY: ''
      BLOB_READ_WRITE_TOKEN: ''
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: |
          mkdir -p app/s/geo-fixture
          cp scripts/tests/e2e/uv-geo-fixture.tsx.txt app/s/geo-fixture/page.tsx
          npm run build
      - run: npm run typecheck
      - run: npx --no-install eslint components/soluciones/CampaignUv*.tsx lib/soluciones/smartnfc-geo.ts scripts/tests/e2e/uv-geo*.ts scripts/tests/soluciones-uv-geo.test.ts
      - run: node --import tsx --test scripts/tests/soluciones-uv-geo.test.ts scripts/tests/soluciones-uv21.test.ts scripts/tests/soluciones-campaign-editor.test.ts scripts/tests/soluciones-campaign-landing.test.ts
      - run: npx --no-install playwright install --with-deps chromium webkit
      - run: npx --no-install playwright test --config scripts/tests/e2e/uv-geo.config.ts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: uv-geo-screenshots
          path: playwright-evidence
          retention-days: 7
